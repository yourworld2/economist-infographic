<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>China's growth has cooled from sizzling to simmering</title>
<style>
  :root {
    --red: #E3120B;
    --ink: #1A1719;
    --grey-3: #5E5E60;
    --grey-9: #CBCCCE;
    --grid: #ECECEC;
    --bg: #FFFFFF;
    --sans: 'Econ Sans', 'Inter', 'Calibri', Arial, sans-serif;
    --c-blue:   #2E45B8; /* Chicago 45 — lead */
    --c-teal:   #1DC9A4; /* Hong Kong 45 — support */
    --c-yellow: #F9C31F; /* New York 55 — alert */
    --c-orange: #F97A1F; /* Singapore 55 — resolution */
    --c-blue-d:   #1B2C7A;
    --c-teal-d:   #0E8B6E;
    --c-yellow-d: #8A5A00;
    --c-orange-d: #B05010;
  }
  body { margin: 0; background: var(--bg); font-family: var(--sans); color: var(--ink); }
  .chart-block {
    width: 800px;
    margin: 24px auto;
    padding: 16px;
    position: relative;
    box-sizing: border-box;
    background: #fff;
  }
  .chart-block::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px;
    height: 2px;
    background: var(--red);
  }
  .flag {
    position: absolute;
    top: 0; left: 16px;
    width: 10px; height: 30px;
    background: var(--red);
  }
  .kicker {
    margin: 16px 0 4px 28px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--red);
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 6px 28px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.2;
    color: var(--ink);
    max-width: 740px;
  }
  .standfirst {
    margin: 0 0 14px 28px;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.4;
    color: #525254;
    max-width: 740px;
  }
  .chart-wrap { margin: 0 0 0 28px; }
  svg { display: block; }
  .source {
    margin: 12px 0 0 28px;
    font-family: var(--sans);
    font-size: 13px;
    color: #696A6C;
  }
  .axis text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
  .gridline { stroke: var(--grid); stroke-width: 0.5; }
  .baseline { stroke: var(--ink); stroke-width: 1; }
  .data-label { font-family: var(--sans); font-size: 11px; font-weight: 700; }
  .series-line { fill: none; stroke-width: 2.5; }
  .series-point { stroke: #fff; stroke-width: 1.5; }
  .legend-text { font-family: var(--sans); font-size: 12px; fill: #525254; }
</style>
</head>
<body>
  <div class="chart-block">
    <div class="flag"></div>
    <div class="kicker">China · Economy</div>
    <h1>China's growth has cooled from sizzling to simmering</h1>
    <p class="standfirst">Real GDP growth, % change on a year earlier · From double-digit expansion in 2010, through a pandemic roller-coaster, to a five-percent landing in 2024</p>
    <div class="chart-wrap">
      <svg width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="China real GDP growth 2010 to 2024 across four phases">
        <!-- Light grey gridlines (allowed in colorful-explainer) -->
        <line class="gridline" x1="50" y1="30"  x2="690" y2="30"/>
        <line class="gridline" x1="50" y1="70"  x2="690" y2="70"/>
        <line class="gridline" x1="50" y1="110" x2="690" y2="110"/>
        <line class="gridline" x1="50" y1="150" x2="690" y2="150"/>
        <line class="gridline" x1="50" y1="190" x2="690" y2="190"/>
        <line class="gridline" x1="50" y1="230" x2="690" y2="230"/>
        <line class="gridline" x1="50" y1="270" x2="690" y2="270"/>

        <!-- y-axis tick labels -->
        <text class="axis" x="42" y="34"  text-anchor="end">12</text>
        <text class="axis" x="42" y="74"  text-anchor="end">10</text>
        <text class="axis" x="42" y="114" text-anchor="end">8</text>
        <text class="axis" x="42" y="154" text-anchor="end">6</text>
        <text class="axis" x="42" y="194" text-anchor="end">4</text>
        <text class="axis" x="42" y="234" text-anchor="end">2</text>
        <text class="axis" x="42" y="274" text-anchor="end">0</text>

        <!-- baseline at y=0 -->
        <line class="baseline" x1="50" y1="270" x2="690" y2="270"/>

        <!-- Phase 1: High-speed 2010–2014 — Chicago 45 (lead) -->
        <polyline class="series-line" stroke="#2E45B8" points="71.33,58 114,78 156.67,112 199.33,114 242,122"/>
        <circle class="series-point" fill="#2E45B8" cx="71.33"  cy="58"  r="4"/>
        <circle class="series-point" fill="#2E45B8" cx="114"    cy="78"  r="4"/>
        <circle class="series-point" fill="#2E45B8" cx="156.67" cy="112" r="4"/>
        <circle class="series-point" fill="#2E45B8" cx="199.33" cy="114" r="4"/>
        <circle class="series-point" fill="#2E45B8" cx="242"    cy="122" r="4"/>
        <text class="data-label" x="71.33"  y="48"  text-anchor="middle" fill="#1B2C7A">10.6</text>
        <text class="data-label" x="114"    y="68"  text-anchor="middle" fill="#1B2C7A">9.6</text>
        <text class="data-label" x="156.67" y="103" text-anchor="middle" fill="#1B2C7A">7.9</text>
        <text class="data-label" x="199.33" y="105" text-anchor="middle" fill="#1B2C7A">7.8</text>
        <text class="data-label" x="242"    y="113" text-anchor="middle" fill="#1B2C7A">7.4</text>

        <!-- Phase 2: Medium-speed 2015–2019 — Hong Kong 45 (support) -->
        <polyline class="series-line" stroke="#1DC9A4" points="284.67,130 327.33,132 370,132 412.67,134 455.33,150"/>
        <circle class="series-point" fill="#1DC9A4" cx="284.67" cy="130" r="4"/>
        <circle class="series-point" fill="#1DC9A4" cx="327.33" cy="132" r="4"/>
        <circle class="series-point" fill="#1DC9A4" cx="370"    cy="132" r="4"/>
        <circle class="series-point" fill="#1DC9A4" cx="412.67" cy="134" r="4"/>
        <circle class="series-point" fill="#1DC9A4" cx="455.33" cy="150" r="4"/>
        <text class="data-label" x="284.67" y="121" text-anchor="middle" fill="#0E8B6E">7.0</text>
        <text class="data-label" x="327.33" y="123" text-anchor="middle" fill="#0E8B6E">6.9</text>
        <text class="data-label" x="370"    y="123" text-anchor="middle" fill="#0E8B6E">6.9</text>
        <text class="data-label" x="412.67" y="125" text-anchor="middle" fill="#0E8B6E">6.8</text>
        <text class="data-label" x="455.33" y="141" text-anchor="middle" fill="#0E8B6E">6.0</text>

        <!-- Phase 3: COVID shock 2020–2022 — New York 55 (alert) -->
        <polyline class="series-line" stroke="#F9C31F" points="498,226 540.67,102 583.33,210"/>
        <circle class="series-point" fill="#F9C31F" cx="498"    cy="226" r="4"/>
        <circle class="series-point" fill="#F9C31F" cx="540.67" cy="102" r="4"/>
        <circle class="series-point" fill="#F9C31F" cx="583.33" cy="210" r="4"/>
        <text class="data-label" x="498"    y="244" text-anchor="middle" fill="#8A5A00">2.2</text>
        <text class="data-label" x="540.67" y="93"  text-anchor="middle" fill="#8A5A00">8.4</text>
        <text class="data-label" x="583.33" y="228" text-anchor="middle" fill="#8A5A00">3.0</text>

        <!-- Phase 4: Recovery 2023–2024 — Singapore 55 (resolution) -->
        <polyline class="series-line" stroke="#F97A1F" points="626,166 668.67,170"/>
        <circle class="series-point" fill="#F97A1F" cx="626"    cy="166" r="4"/>
        <circle class="series-point" fill="#F97A1F" cx="668.67" cy="170" r="4"/>
        <text class="data-label" x="626"    y="157" text-anchor="middle" fill="#B05010">5.2</text>
        <text class="data-label" x="668.67" y="161" text-anchor="middle" fill="#B05010">5.0</text>

        <!-- x-axis year labels -->
        <text class="axis" x="71.33"  y="290" text-anchor="middle">2010</text>
        <text class="axis" x="114"    y="290" text-anchor="middle">2011</text>
        <text class="axis" x="156.67" y="290" text-anchor="middle">2012</text>
        <text class="axis" x="199.33" y="290" text-anchor="middle">2013</text>
        <text class="axis" x="242"    y="290" text-anchor="middle">2014</text>
        <text class="axis" x="284.67" y="290" text-anchor="middle">2015</text>
        <text class="axis" x="327.33" y="290" text-anchor="middle">2016</text>
        <text class="axis" x="370"    y="290" text-anchor="middle">2017</text>
        <text class="axis" x="412.67" y="290" text-anchor="middle">2018</text>
        <text class="axis" x="455.33" y="290" text-anchor="middle">2019</text>
        <text class="axis" x="498"    y="290" text-anchor="middle">2020</text>
        <text class="axis" x="540.67" y="290" text-anchor="middle">2021</text>
        <text class="axis" x="583.33" y="290" text-anchor="middle">2022</text>
        <text class="axis" x="626"    y="290" text-anchor="middle">2023</text>
        <text class="axis" x="668.67" y="290" text-anchor="middle">2024</text>

        <!-- Legend -->
        <g transform="translate(50, 320)">
          <line x1="0"   y1="6" x2="22" y2="6" stroke="#2E45B8" stroke-width="3"/>
          <text x="28"  y="10" class="legend-text">High-speed, 2010–14</text>
          <line x1="190" y1="6" x2="212" y2="6" stroke="#1DC9A4" stroke-width="3"/>
          <text x="218" y="10" class="legend-text">Medium-speed, 2015–19</text>
          <line x1="400" y1="6" x2="422" y2="6" stroke="#F9C31F" stroke-width="3"/>
          <text x="428" y="10" class="legend-text">Pandemic shock, 2020–22</text>
          <line x1="620" y1="6" x2="642" y2="6" stroke="#F97A1F" stroke-width="3"/>
          <text x="648" y="10" class="legend-text">Recovery, 2023–24</text>
        </g>
      </svg>
    </div>
    <p class="source">Source: National Bureau of Statistics of China</p>
  </div>
</body>
</html>
